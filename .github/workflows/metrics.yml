name: Metrics
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AdrianeDriane
          template: classic
          
          # Only enables the "Last Updated" timestamp footer
          base: metadata
          
          config_timezone: Asia/Manila

          # Default is "0, 8 + 11%", which leaves ~90px of blank space at the bottom
          # (gap before footer.svg in the README)
          config_padding: 0, 10
          
          # Isometric contribution calendar (streaks + commits/day)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Languages (Most used)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_ignored: svg
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          # Lines of code pushed (history graph, no repo names)
          # delay: GitHub returns 202 (no data) on the first stats request, so wait and retry
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_delay: 30

          # WakaTime (last week: time, languages, editors, OS)
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, languages-graphs, editors, os
          plugin_wakatime_limit: 5

          # Output
          filename: metrics.svg
          config_output: svg
