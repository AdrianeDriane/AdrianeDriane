name: Metrics
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AdrianeDriane
          template: classic
          
          # Only enables the "Last Updated" timestamp footer
          base: metadata
          
          config_timezone: Asia/Manila

          # Default is "0, 8 + 11%", which leaves a big blank gap before footer.svg.
          # Height is measured on GitHub's Linux runner; macOS/Windows fonts render
          # ~15px taller, so 10 clipped the "Last updated" line. 36 leaves room.
          config_padding: 0, 36
          
          # Isometric contribution calendar (streaks + commits/day)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # WakaTime (last week: time, top language, editor, OS)
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 7
          plugin_wakatime_sections: time, languages, editors, os
          plugin_wakatime_limit: 5

          # Output
          filename: metrics.svg
          config_output: svg
